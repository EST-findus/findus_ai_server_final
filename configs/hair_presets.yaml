  - {key: natural_black, name: 자연 흑발,     hex: "#1C1A19"}
  - {key: soft_black,    name: 소프트 블랙,   hex: "#2B2523"}
  - {key: dark_brown,    name: 다크 브라운,   hex: "#3B2A20"}
  - {key: deep_ash,      name: 딥 애쉬 브라운, hex: "#3E3833"}
  - {key: mocha,         name: 모카 브라운,   hex: "#6A4E3B"}
  - {key: matte,         name: 매트(올리브) 브라운, hex: "#5E5444"}
  - {key: ash_brown,     name: 애쉬 브라운,   hex: "#6B5A4E"}
  - {key: khaki,         name: 카키 브라운,   hex: "#6B5E45"}
  - {key: milk_brown,    name: 밀크 브라운,   hex: "#9C7B62"}
  - {key: cherry,        name: 체리 브라운,   hex: "#5A2A27"}
  - {key: wine,          name: 와인 레드,     hex: "#5C1E2B"}
  - {key: red_purple,    name: 레드 퍼플,     hex: "#5E2440"}
  - {key: copper,        name: 코퍼 오렌지,   hex: "#9A4E2A"}
  - {key: ash_gray,      name: 애쉬 그레이,   hex: "#8A8784"}

